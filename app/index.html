<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/closeredge-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>CloserEdge AI</title>
    <script>
      // Pre-paint theme bootstrap — keep in sync with src/providers/ThemeProvider.tsx
      // and src/store/themeSlice.ts. Runs before React (and before redux-persist
      // rehydrates) so a dark-mode launch never flashes light. Reads the
      // redux-persist blob at `persist:theme` (values are double-JSON-encoded).
      (function () {
        var mode = 'system';
        try {
          var raw = localStorage.getItem('persist:theme');
          if (raw) {
            var parsed = JSON.parse(JSON.parse(raw).mode);
            if (parsed === 'light' || parsed === 'dark' || parsed === 'system') mode = parsed;
          }
        } catch (e) {
          /* corrupt/absent persistence — fall back to system */
        }
        var dark = mode === 'dark';
        if (mode === 'system') {
          try {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (e) {
            dark = false;
          }
        }
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
