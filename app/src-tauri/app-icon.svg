<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    CloserEdge app-icon source. White background + the brand chevron mark
    (mirrors app/public/brand/closeredge-mark.svg). Regenerate the platform
    icon set with the vendored CLI:
      cargo-tauri icon app/src-tauri/app-icon.svg -o app/src-tauri/icons
  -->
  <defs>
    <linearGradient id="ce-top" x1="0" y1="10" x2="70" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A3DC9"/>
      <stop offset="100%" stop-color="#9B8FFF"/>
    </linearGradient>
    <linearGradient id="ce-bot" x1="0" y1="60" x2="70" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3D32B0"/>
      <stop offset="100%" stop-color="#7B6EF6"/>
    </linearGradient>
    <linearGradient id="ce-hi" x1="15" y1="20" x2="70" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9B8FFF" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#7B6EF6" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#ffffff"/>
  <g transform="translate(172 215) scale(8.5)">
    <path d="M0 4 L70 35 L22 33 Z" fill="url(#ce-top)"/>
    <path d="M0 66 L70 35 L22 37 Z" fill="url(#ce-bot)"/>
    <path d="M10 14 L70 35 L24 34 Z" fill="url(#ce-hi)" opacity=".5"/>
  </g>
</svg>
