<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/alpha.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloserEdge AI</title>
    <script>
      // Pre-paint theme bootstrap — mirrors ThemeProvider's resolution so the
      // first frame already has the right background (no light/dark flash).
      // Reads the redux-persist blob written by store/index.ts (key
      // `persist:theme`, field `mode` is itself JSON-encoded by redux-persist).
      (function () {
        var mode = 'system';
        try {
          var raw = localStorage.getItem('persist:theme');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && typeof parsed.mode === 'string') {
              var m = JSON.parse(parsed.mode);
              if (m === 'light' || m === 'dark' || m === 'system') mode = m;
            }
          }
        } catch (e) {
          /* storage unavailable or corrupt — fall back to system */
        }
        var dark = mode === 'dark';
        if (mode === 'system') {
          try {
            dark = !!(
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            );
          } catch (e) {
            dark = false;
          }
        }
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
