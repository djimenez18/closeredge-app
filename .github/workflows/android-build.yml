---
# Android Build — APK pipeline on free Ubuntu runners.
#
# Produces a debug-signed universal APK (arm64 + x86_64) that installs on
# real devices AND on Appetize.io's Android emulators (x86_64) for
# browser-based testing — same flow as the iOS lane.
#
# TAURI_APP_PATH prevents the monorepo project-resolution bug that bit the
# iOS lane: the gradle rustBuild task shells out to
# `npm run -- tauri android android-studio-script`, which walks up from
# app/ and finds the DESKTOP src-tauri/ first. The env var (read by
# tauri-cli's app_paths before any cwd lookup) propagates through gradle
# to that child process.
name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, feat/mobile-app]
    paths:
      - "app/src-tauri-mobile/**"
      - "app/src/**"
      - "packages/tauri-plugin-ptt/**"
      - "scripts/android-init.sh"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Debug APK (arm64 + x86_64)
    runs-on: ubuntu-latest
    env:
      TAURI_APP_PATH: ${{ github.workspace }}/app/src-tauri-mobile
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri-mobile -> target
            packages/tauri-plugin-ptt -> target
          cache-on-failure: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: bash scripts/ci-cancel-aware.sh pnpm install --frozen-lockfile

      # The runner image preinstalls the Android SDK + several NDKs;
      # ANDROID_HOME is preset, NDK via ANDROID_NDK_LATEST_HOME.
      - name: Scaffold Android project (tauri android init)
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" bash scripts/android-init.sh

      - name: Build debug APK
        working-directory: app/src-tauri-mobile
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: >
          bash ../../scripts/ci-cancel-aware.sh
          env NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx --package=@tauri-apps/cli@2.10.1 tauri android build --ci --debug --apk
          --target aarch64 --target x86_64

      - name: Locate + rename APK
        working-directory: app/src-tauri-mobile
        run: |
          set -euo pipefail
          APK=$(find gen/android -name "*-debug.apk" -path "*universal*" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find gen/android -name "*-debug.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::No debug APK produced under gen/android"
            find gen/android -name "*.apk" 2>/dev/null | head -10
            exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" CloserEdgeAI-android.apk
          ls -la CloserEdgeAI-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloserEdgeAI-Android-apk
          path: app/src-tauri-mobile/CloserEdgeAI-android.apk
          retention-days: 30

      # Same Appetize flow as iOS: APPETIZE_ANDROID_PUBLIC_KEY pins one app
      # entry whose browser URL updates on every push; unset on first run,
      # which creates the entry (grab publicKey from the response and store
      # it as the secret).
      - name: Upload to Appetize.io
        if: ${{ env.APPETIZE_API_TOKEN != '' }}
        env:
          APPETIZE_ANDROID_PUBLIC_KEY: ${{ secrets.APPETIZE_ANDROID_PUBLIC_KEY }}
        working-directory: app/src-tauri-mobile
        run: |
          set -euo pipefail
          URL="https://api.appetize.io/v1/apps"
          if [ -n "${APPETIZE_ANDROID_PUBLIC_KEY:-}" ]; then URL="$URL/$APPETIZE_ANDROID_PUBLIC_KEY"; fi
          HTTP=$(curl -sS -o /tmp/appetize-resp.json -w "%{http_code}" "$URL" \
            -F "file=@CloserEdgeAI-android.apk" \
            -F "platform=android" \
            -u "$APPETIZE_API_TOKEN:")
          echo "Appetize HTTP $HTTP"
          cat /tmp/appetize-resp.json; echo
          [ "$HTTP" = "200" ]
