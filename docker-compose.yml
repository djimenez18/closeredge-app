# CloserEdge AI Core — Docker Compose for self-hosted cloud deploy.
#
# Brings up the headless Rust core (`closeredge-core`) on :7788, persists the
# workspace to a named volume, and reads secrets/config from a `.env` file
# next to this compose file.
#
# Usage:
#   1. cp .env.example .env  (then edit values — at minimum BACKEND_URL and
#      CLOSEREDGE_CORE_TOKEN; the latter is required for any client that calls
#      /rpc on this instance)
#   2. docker compose up -d
#   3. curl http://localhost:7788/health
#
# The image is built from the repo Dockerfile. To pin a published image
# instead of building, replace `build:` with `image: ghcr.io/.../closeredge-core:<tag>`.

services:
  closeredge-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: closeredge-core:local
    container_name: closeredge-core
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    ports:
      - "${CLOSEREDGE_CORE_PORT:-7788}:7788"
    env_file:
      - path: .env
        required: false
    environment:
      # Bind to 0.0.0.0 inside the container so port-forwarding works regardless
      # of what `.env` says. The Dockerfile already sets this default, but make
      # it explicit so an inherited shell value cannot override it.
      CLOSEREDGE_CORE_HOST: 0.0.0.0
      CLOSEREDGE_CORE_PORT: "7788"
      CLOSEREDGE_WORKSPACE: /home/closeredge/.closeredge
      XDG_CACHE_HOME: /home/closeredge/.closeredge/cache
      TMPDIR: /tmp
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - closeredge-workspace:/home/closeredge/.closeredge
    mem_limit: ${CLOSEREDGE_CORE_MEM_LIMIT:-4g}
    cpus: ${CLOSEREDGE_CORE_CPUS:-2.0}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7788/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  closeredge-workspace:
    name: closeredge-workspace
