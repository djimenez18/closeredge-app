<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- CloserEdge AI Mascot — Super Fat Glossy Star Plushie -->
<defs>
  <!-- Main body gradient — deep to bright purple -->
  <radialGradient id="bodyGrad" cx="50%" cy="40%" r="55%" fx="45%" fy="35%">
    <stop offset="0%" stop-color="#A855F7"/>
    <stop offset="50%" stop-color="#7C3AED"/>
    <stop offset="100%" stop-color="#5B21B6"/>
  </radialGradient>
  <!-- Glossy highlight -->
  <radialGradient id="sheen" cx="38%" cy="30%" r="40%">
    <stop offset="0%" stop-color="white" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="white" stop-opacity="0"/>
  </radialGradient>
  <!-- Bottom glow -->
  <radialGradient id="bottomGlow" cx="50%" cy="100%" r="60%">
    <stop offset="0%" stop-color="#C084FC" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Drop shadow -->
<ellipse cx="500" cy="890" rx="160" ry="20" fill="#3B0764" opacity="0.2"/>

<!-- Main body — SUPER fat round star, barely indented valleys -->
<!-- Think: inflated balloon star, almost a circle with 5 gentle bumps -->
<path d="
  M 500 100
  C 535 100, 555 165, 555 210
  C 555 260, 570 290, 610 310
  C 655 335, 710 335, 760 350
  C 815 370, 860 400, 870 440
  C 880 480, 860 510, 820 520
  C 780 535, 740 525, 710 545
  C 675 570, 660 610, 660 660
  C 660 715, 685 760, 715 800
  C 745 840, 755 870, 740 895
  C 725 920, 690 925, 660 910
  C 625 890, 590 850, 560 825
  C 535 805, 515 800, 500 800
  C 485 800, 465 805, 440 825
  C 410 850, 375 890, 340 910
  C 310 925, 275 920, 260 895
  C 245 870, 255 840, 285 800
  C 315 760, 340 715, 340 660
  C 340 610, 325 570, 290 545
  C 260 525, 220 535, 180 520
  C 140 510, 120 480, 130 440
  C 140 400, 185 370, 240 350
  C 290 335, 345 335, 390 310
  C 430 290, 445 260, 445 210
  C 445 165, 465 100, 500 100
  Z
" fill="url(#bodyGrad)"/>

<!-- Glossy sheen overlay -->
<path d="
  M 500 110
  C 530 110, 548 170, 548 210
  C 548 255, 562 282, 598 300
  C 640 322, 695 325, 742 340
  C 795 358, 840 385, 850 420
  C 860 455, 845 480, 810 490
  C 775 502, 738 494, 708 510
  L 500 420
  L 292 510
  C 262 494, 225 502, 190 490
  C 155 480, 140 455, 150 420
  C 160 385, 205 358, 258 340
  C 305 325, 360 322, 402 300
  C 438 282, 452 255, 452 210
  C 452 170, 470 110, 500 110
  Z
" fill="url(#sheen)"/>

<!-- Bottom ambient glow -->
<ellipse cx="500" cy="700" rx="250" ry="200" fill="url(#bottomGlow)"/>

<!-- Tiny arm nubs — left -->
<ellipse cx="148" cy="470" rx="32" ry="22" fill="#7C3AED" transform="rotate(-15 148 470)"/>
<ellipse cx="152" cy="465" rx="22" ry="15" fill="#9461FF" opacity="0.4" transform="rotate(-15 152 465)"/>

<!-- Tiny arm nubs — right -->
<ellipse cx="852" cy="470" rx="32" ry="22" fill="#7C3AED" transform="rotate(15 852 470)"/>
<ellipse cx="848" cy="465" rx="22" ry="15" fill="#9461FF" opacity="0.4" transform="rotate(15 848 465)"/>

<!-- Face -->
<g transform="translate(500, 480)">
  <!-- Left eye — big round with highlight -->
  <circle cx="-75" cy="-30" r="38" fill="#1a0a30"/>
  <circle cx="-75" cy="-30" r="32" fill="#2D1654"/>
  <circle cx="-75" cy="-28" r="22" fill="white"/>
  <circle cx="-70" cy="-32" r="15" fill="#1a0a30"/>
  <circle cx="-64" cy="-40" r="8" fill="white"/>
  <circle cx="-78" cy="-22" r="5" fill="white" opacity="0.7"/>

  <!-- Right eye — big round with highlight -->
  <circle cx="75" cy="-30" r="38" fill="#1a0a30"/>
  <circle cx="75" cy="-30" r="32" fill="#2D1654"/>
  <circle cx="75" cy="-28" r="22" fill="white"/>
  <circle cx="80" cy="-32" r="15" fill="#1a0a30"/>
  <circle cx="86" cy="-40" r="8" fill="white"/>
  <circle cx="72" cy="-22" r="5" fill="white" opacity="0.7"/>

  <!-- Mouth — small cute smile -->
  <path d="M -20 35 Q 0 52, 20 35" stroke="#2D1654" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Cheek blush — left -->
  <ellipse cx="-120" cy="15" rx="32" ry="18" fill="#E879A8" opacity="0.3"/>

  <!-- Cheek blush — right -->
  <ellipse cx="120" cy="15" rx="32" ry="18" fill="#E879A8" opacity="0.3"/>
</g>

<!-- Big glossy highlight bubble — upper left -->
<ellipse cx="380" cy="260" rx="70" ry="50" fill="white" opacity="0.15" transform="rotate(-20 380 260)"/>
<ellipse cx="365" cy="240" rx="30" ry="22" fill="white" opacity="0.3" transform="rotate(-20 365 240)"/>

<!-- Small highlight — upper right -->
<ellipse cx="620" cy="290" rx="35" ry="25" fill="white" opacity="0.1" transform="rotate(15 620 290)"/>

</svg>
